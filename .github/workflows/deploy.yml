name: Deploy Nahj al-Balagha UI

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Next.js
        run: |
          npm ci
          npm run build

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e

            echo "========================================"
            echo "Deploying Nahj al-Balagha UI"
            echo "========================================"

            echo "Server:"
            hostname

            echo "Deployment user:"
            whoami

            echo "Checking nahjui user..."
            id nahjui

            sudo -u nahjui -H bash -lc '
              set -e

              source ~/.nvm/nvm.sh
              nvm use 22

              cd /home/nahjui/app

              echo "Pulling latest code..."
              git fetch origin
              git reset --hard origin/main

              echo "Installing dependencies..."
              npm ci

              echo "Building Next.js..."
              npm run build
            '

            echo "Restarting Next.js..."
            sudo -n systemctl restart nahj-ui

            echo "Checking Next.js service..."
            sudo -n systemctl is-active --quiet nahj-ui

            echo "Testing Next.js..."
            curl -f http://127.0.0.1:3000/ > /dev/null

            echo "========================================"
            echo "Deployment successful"
            echo "========================================"